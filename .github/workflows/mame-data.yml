name: MAME data for Bootcade

# Ce que le homelab de Bootcade (CT 105) tire de l'executable MAME : la liste
# des machines du MAME en developpement (« Sooner », mame -listxml) et la
# chaine de version des deux canaux (mame -version).
#
# L'executable vient de la CI Linux de mamedev (mamedev/mame, ci-linux.yml),
# qui le laisse en artefact apres chaque passage. Elle tourne sur ubuntu-latest :
# depuis le 2026-11-10 ce MAME exige glibc 2.43 et Qt 6.10, que Debian 13
# (CT 105) n'a pas. Il ne demarre donc plus que sur la meme image que leur CI :
# c'est ici qu'on le lance, et le homelab ne fait plus que lire le resultat.
#
# Publie dans la pre-release « mame-data » de ce depot (jamais « latest ») :
#   mame-sooner.json            fiche du dernier passage master reussi
#   mame-sooner-<commit>.xml.xz sa liste des machines (nommee par commit : une
#                               fiche ne designe jamais un fichier remplace)
#   mame-release.json           fiche du passage du tag de la derniere version
# La fiche s'envoie en dernier. Un canal deja publie pour le meme commit ne
# refait rien. Puis le homelab est prevenu (hook « mame », meme secret que
# generate-dats.yml) ; son cron de minuit rattrape s'il etait eteint.
#
# Un passage court par jour, jamais de job permanent (GitHub les bride).
on:
  schedule:
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mame-data
  cancel-in-progress: false

jobs:
  mame:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: mame-data
    steps:
      - name: Make sure the mame-data pre-release exists
        run: |
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$REPO" --prerelease --latest=false \
              --title "MAME data for Bootcade" \
              --notes "Generated by mame-data.yml from the MAME Linux CI build. Not a FinalBurn Neo release."

      - name: Run MAME and publish what the homelab needs
        id: run
        run: |
          set -euo pipefail
          deps_done=""
          changed=""

          # Le plus recent passage reussi d'une branche (ou d'un tag) de leur CI Linux,
          # choisi ici : le filtre status=success de l'API n'est pas fiable.
          pick() {
            gh api "repos/mamedev/mame/actions/workflows/ci-linux.yml/runs?branch=$1&event=push&per_page=30" \
              --jq '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success")]
                    | sort_by(.created_at) | last // empty | "\(.id) \(.head_sha) \(.created_at)"'
          }

          published() {  # published <canal> : commit de la fiche en ligne, ou rien
            curl -fsSL "https://github.com/$REPO/releases/download/$TAG/mame-$1.json" 2>/dev/null \
              | jq -r '.commit // empty' || true
          }

          deps() {  # les bibliotheques de leur CI (meme liste, meme image)
            [ -n "$deps_done" ] && return 0
            sudo apt-get -y -qq update
            sudo apt-get -y -qq install libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev \
              libxinerama-dev libxi-dev qt6-base-dev >/dev/null
            deps_done=1
          }

          # channel <canal> <ref> [tag de version]
          channel() {
            local ch="$1" ref="$2" version_tag="${3:-}" run sha date art dir build files=()
            read -r run sha date < <(pick "$ref") || true
            if [ -z "${run:-}" ]; then
              echo "::warning::$ch : aucun passage CI Linux reussi pour $ref"
              return 0
            fi
            if [ "$(published "$ch")" = "$sha" ]; then
              echo "$ch : ${sha:0:11} deja publie"
              return 0
            fi
            art="$(gh api "repos/mamedev/mame/actions/runs/$run/artifacts" \
              --jq '[.artifacts[] | select((.name | startswith("mame-linux-clang-")) and (.expired | not))][0].name // empty')"
            if [ -z "$art" ]; then
              echo "::warning::$ch : pas d'artefact mame-linux-clang dans le passage $run"
              return 0
            fi
            deps
            dir="work-$ch"; rm -rf "$dir"; mkdir -p "$dir/home"
            # nightly.link : l'artefact d'un depot public sans jeton (GitHub en exige un).
            curl -fsSL --retry 3 --retry-delay 20 -o "$dir/artifact.zip" \
              "https://nightly.link/mamedev/mame/actions/runs/$run/$art.zip"
            unzip -q -o "$dir/artifact.zip" mame -d "$dir"
            chmod +x "$dir/mame"
            build="$(cd "$dir" && HOME="$PWD/home" ./mame -version)"
            echo "$ch : $build (passage $run)"
            local listxml="" listxml_sha=""
            if [ "$ch" = "sooner" ]; then
              listxml="mame-sooner-$sha.xml.xz"
              (cd "$dir" && HOME="$PWD/home" SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./mame -listxml) \
                | xz -T0 -6 > "$listxml"
              xz -t "$listxml"
              listxml_sha="$(sha256sum "$listxml" | cut -d' ' -f1)"
              ls -l "$listxml"
              gh release upload "$TAG" "$listxml" -R "$REPO" --clobber
            fi
            jq -n --arg ch "$ch" --arg tag "$version_tag" --arg build "$build" --arg sha "$sha" \
                  --argjson run "$run" --arg date "$date" --arg art "$art" \
                  --arg lx "$listxml" --arg lxsha "$listxml_sha" \
              '{schema_version: 1, channel: $ch, tag: $tag, build: $build, commit: $sha, ci_run: $run,
                date: $date, artifact: $art, listxml: $lx, listxml_sha256: $lxsha}' > "mame-$ch.json"
            cat "mame-$ch.json"
            gh release upload "$TAG" "mame-$ch.json" -R "$REPO" --clobber
            rm -rf "$dir"
            changed=1
          }

          version_tag="$(gh api repos/mamedev/mame/releases/latest --jq .tag_name)"
          channel sooner master
          channel release "$version_tag" "$version_tag"

          # Les listes Sooner des commits precedents : la fiche n'y renvoie plus.
          keep="$(jq -r '.listxml // empty' mame-sooner.json 2>/dev/null || \
                  curl -fsSL "https://github.com/$REPO/releases/download/$TAG/mame-sooner.json" | jq -r '.listxml // empty')"
          gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' \
            | grep '^mame-sooner-.*\.xml\.xz$' | grep -vxF "$keep" \
            | while read -r old; do gh release delete-asset "$TAG" "$old" -R "$REPO" -y; done || true

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Meme mecanisme que generate-dats.yml : HMAC-SHA256 du corps. Jamais bloquant.
      - name: Notify the homelab
        if: steps.run.outputs.changed == '1'
        continue-on-error: true
        env:
          SECRET: ${{ secrets.HOMELAB_WEBHOOK_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then echo "HOMELAB_WEBHOOK_SECRET absent, pas de notification."; exit 0; fi
          url="https://github.com/$REPO/releases/download/$TAG/mame-sooner.json"
          for i in $(seq 1 12); do
            code="$(curl -sIL -o /dev/null -w '%{http_code}' "$url")"
            [ "$code" = "200" ] && break
            echo "fiche pas encore servie ($code), attente..."; sleep 5
          done
          body="{\"event\":\"mame-data-published\",\"run\":\"${{ github.run_id }}\"}"
          sig="$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')"
          curl -fsS --retry 3 --retry-delay 10 --max-time 20 -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            -d "$body" https://files.bootcade.duckdns.org/hooks/mame
