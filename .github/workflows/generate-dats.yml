name: Generate DAT files

# Produit les .dat a partir du binaire deja publie par la synchronisation.
#
# A part parce que rien ne depend d'elle : une generation qui echoue ne doit
# pas emporter la release, et une fusion qui echoue ne doit pas empecher de
# regenerer les DAT depuis le binaire en place. C'est l'inverse qui s'est
# produit le 31 aout : un conflit dans sshot.cpp a fait echouer l'execution
# unique, et plus aucun DAT n'a ete publie pendant deux jours pendant que le
# catalogue affichait toujours la date du 30 aout.
#
# Ne reconstruit pas : elle telecharge le binaire de la release, ce qui garantit
# que les DAT decrivent exactement ce que les joueurs executent.

on:
  workflow_run:
    workflows: ["Sync upstream and release"]
    types: [completed]
  workflow_dispatch:

# Declenche a chaque fin de synchronisation, y compris celles lancees a la
# main pour autre chose. La premiere etape compare donc les dates des assets
# de la release : si les DAT sont deja plus recents que le binaire, il n'y a
# rien a regenerer et le reste est saute (en declenchement manuel, on
# regenere toujours).

permissions:
  contents: write

jobs:
  dats:
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless the binary is newer than the published DATs
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          binary="$(gh release view latest -R "${{ github.repository }}" --json assets --jq '.assets[] | select(.name=="linux-sdl2-x86_64.zip") | .updatedAt')"
          dats="$(gh release view latest -R "${{ github.repository }}" --json assets --jq '.assets[] | select(.name=="fbneo-dats.zip") | .updatedAt')"
          echo "binaire: ${binary:-absent} / DAT: ${dats:-absents}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$dats" ] || [ "$binary" \> "$dats" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "DAT deja a jour, rien a faire."
          fi

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libsdl2-2.0-0 libsdl2-image-2.0-0

      - name: Fetch the published build
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download latest -R "${{ github.repository }}" -p linux-sdl2-x86_64.zip
          unzip -o linux-sdl2-x86_64.zip
          chmod +x fbneo

      - name: Generate DAT files
        if: steps.gate.outputs.run == 'true'
        run: |
          # -dat ecrit un .dat par systeme depuis la liste de pilotes du binaire
          # (generateDats() dans src/burner/sdl/main.cpp, aucune ROM requise).
          # SDL_VIDEODRIVER=dummy pour tourner sans affichage. Le chemin de
          # sortie n'est PAS relatif au repertoire courant :
          # FixAndCreateSupportPath (config.cpp) resout szAppDatListsPath via
          # SDL_GetPrefPath, soit $HOME/.local/share/fbneo/support/lists/dat/
          # sous Linux, constate dans le journal d'une execution ratee.
          SDL_VIDEODRIVER=dummy ./fbneo -dat
          zip --junk-paths fbneo-dats.zip "$HOME/.local/share/fbneo/support/lists/dat"/*.dat
          unzip -l fbneo-dats.zip | tail -1

      # Le genre, la serie, le nombre de joueurs et la prise en charge des
      # meilleurs scores sont declares par chaque pilote dans sa structure
      # BurnDriver, et n'apparaissent dans aucun DAT. Ils sont extraits ici,
      # au meme moment et depuis la meme source que les DAT, pour qu'ils ne
      # puissent pas diverger.
      - name: Check out the source
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: |
            src/burn/drv
            src/burner
            .github/scripts

      - name: Extract game metadata
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 source/.github/scripts/fbneo-metadata.py source/src fbneo-meta.json

      - name: Attach them to the release
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest fbneo-dats.zip fbneo-meta.json -R "${{ github.repository }}" --clobber

      # Le homelab (CT 105) se met a jour dans la foulee au lieu d'attendre
      # son cron : signature HMAC-SHA256 du corps, meme mecanisme que les
      # webhooks GitHub natifs. Le secret est HOMELAB_WEBHOOK_SECRET dans les
      # secrets du depot ; cote homelab, scripts/provision-ct105-webhook.sh.
      # Jamais bloquant : si le homelab est eteint, son cron rattrapera.
      - name: Notify the homelab
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          SECRET: ${{ secrets.HOMELAB_WEBHOOK_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then echo "HOMELAB_WEBHOOK_SECRET absent, pas de notification."; exit 0; fi
          # L'URL de telechargement repond 404 pendant quelques secondes apres
          # l'upload (constate le 2026-09-21) : attendre qu'elle serve avant de
          # prevenir, sinon le homelab va chercher un fichier pas encore la.
          url="https://github.com/${{ github.repository }}/releases/download/latest/fbneo-dats.zip"
          for i in $(seq 1 12); do
            code="$(curl -sIL -o /dev/null -w '%{http_code}' "$url")"
            [ "$code" = "200" ] && break
            echo "asset pas encore servi ($code), attente..."; sleep 5
          done
          body="{\"event\":\"dats-published\",\"run\":\"${{ github.run_id }}\"}"
          sig="$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')"
          curl -fsS --retry 3 --retry-delay 10 --max-time 20 -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            -d "$body" https://files.bootcade.duckdns.org/hooks/dats
