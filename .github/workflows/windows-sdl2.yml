name: Windows SDL2 (experimental)

# Build Windows du port SDL2 (celui de Linux) sous MSYS2/MinGW.
# Lance a la main : le zip n'est alors qu'un artefact du run. Appele par
# sync-upstream.yml (publish=true) : le zip est aussi ajoute a la release
# "latest", apres la publication Linux. Rien ne depend de ce job : s'il echoue,
# la release Linux, les DAT et le webhook ne sont pas touches.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # master, pas le commit du declencheur : apres une synchro, c'est le
      # merge qui vient d'etre pousse.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: master

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            perl
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-curl

      - name: Build Windows SDL2
        run: make -j$(nproc) sdl2 SKIPDEPEND=1 RELEASEBUILD=1

      - name: Package
        run: |
          ls -l fbneo.exe
          mkdir out
          cp fbneo.exe src/license.txt out/
          # DLL dont depend l'exe (SDL2, SDL2_image, curl...), prises dans MinGW64.
          ldd fbneo.exe | awk '/mingw64/ {print $3}' | xargs -I{} cp {} out/
          cd out && zip -r ../windows-sdl2-x86_64.zip .

      - name: Smoke test (sans jeu, doit afficher l'aide ou un code propre)
        run: |
          cd out
          ./fbneo.exe -h || echo "exit=$?"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-sdl2-x86_64
          path: windows-sdl2-x86_64.zip

      - name: Add the zip to the latest release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload latest windows-sdl2-x86_64.zip --clobber -R "${{ github.repository }}"
