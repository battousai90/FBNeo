name: Build and release fbneo-sdl

# Construit le binaire SDL2 et publie les DAT.
#
# Enchaine sur la synchronisation, mais dans une execution distincte : quand
# la fusion amont echoue, celle-ci tourne quand meme sur le master en place et
# republie. Une panne de synchronisation reste une panne de synchronisation,
# elle n'emporte plus la publication avec elle.
#
# Relancable seule, ce qui permet de reconstruire sans refaire de fusion.

on:
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master

      - name: Skip when the current commit is already published
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Reconstruire un commit deja publie ne produirait que des fichiers
          # identiques, et ferait tourner la CI pour rien tous les jours. Un
          # declenchement manuel passe outre : c'est le geste qu'on fait
          # justement quand on veut republier.
          HEAD_SHA="$(git rev-parse HEAD)"
          PUBLISHED="$(gh release view latest -R "${{ github.repository }}" --json targetCommitish --jq .targetCommitish 2>/dev/null || echo "")"
          if [ "$HEAD_SHA" = "$PUBLISHED" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "  deja publie : $HEAD_SHA"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.state.outputs.skip == 'false'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libsdl2-dev libsdl2-image-dev

      - name: Build Linux SDL2
        if: steps.state.outputs.skip == 'false'
        run: |
          make -j$(nproc) sdl2 SKIPDEPEND=1 RELEASEBUILD=1
          zip --junk-paths linux-sdl2-x86_64.zip fbneo src/license.txt

      - name: Generate DAT files
        if: steps.state.outputs.skip == 'false'
        run: |
          # -dat ecrit un .dat par systeme depuis la liste de pilotes du
          # binaire qu'on vient de construire (generateDats() dans
          # src/burner/sdl/main.cpp, aucune ROM requise). SDL_VIDEODRIVER=dummy
          # pour tourner sans affichage. Le chemin de sortie n'est PAS relatif
          # au repertoire courant : FixAndCreateSupportPath (config.cpp) resout
          # szAppDatListsPath via SDL_GetPrefPath, soit
          # $HOME/.local/share/fbneo/support/lists/dat/ sous Linux, constate
          # dans le journal d'une execution ratee et non devine.
          SDL_VIDEODRIVER=dummy ./fbneo -dat
          zip --junk-paths fbneo-dats.zip "$HOME/.local/share/fbneo/support/lists/dat"/*.dat

      - name: Publish release
        if: steps.state.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "latest" -R "${{ github.repository }}" > /dev/null 2>&1; then
            gh release delete "latest" -R "${{ github.repository }}" --cleanup-tag --yes
          fi
          gh release create "latest" -R "${{ github.repository }}" --title "FBNeo-sdl (synced $(date -u +%Y-%m-%d))" \
            --latest --target "$(git rev-parse HEAD)" \
            --notes "Rebuild of finalburnneo/FBNeo master with the SDL/Linux DAT-generation gaps restored (GBA, Bally Astrocade). Upstream no longer maintains SDL/Linux, see https://raw.githubusercontent.com/finalburnneo/FBNeo/master/.github/workflows/nightly-release.yml notes.

          fbneo-dats.zip: DAT files generated by this build, pulled daily by the bootcade.duckdns.org homelab (scripts/fetch-fbneo-dats.sh in the homelab repo)." \
            linux-sdl2-x86_64.zip fbneo-dats.zip
