name: Sync upstream and release

# Remet ce fork a jour sur finalburnneo/FBNeo, construit le binaire SDL2 et
# publie la release. Ces trois choses vont ensemble : sans fusion il n'y a
# rien de neuf a construire, et sans construction il n'y a rien a publier.
#
# La generation des DAT, elle, est a part (generate-dats.yml). Elle depend du
# binaire publie ici mais rien ne depend d'elle : un probleme de DAT ne doit
# pas empecher la release, et un echec de fusion ne doit pas empecher de
# regenerer des DAT depuis le binaire deja publie.
#
# Verifie aussi que le generateur SDL n'a pas pris de retard sur celui de
# Windows, et ouvre une issue le cas echeant : upstream ajoute des consoles
# cote Windows sans toucher a SDL, et nous livrions alors des DAT incomplets
# sans le savoir.

# Lance par watch-upstream.yml des que le fork est en retard sur l'amont
# (GitHub ne notifie pas un fork des commits de son amont, et son cron
# `schedule` n'est pas fiable : voir ce workflow). Ici, il n'y a plus qu'a
# fusionner, construire et publier, puis passer la main a generate-dats.yml.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master

      # Le CODE de l'amont, pas son historique. Une fusion importait chacun
      # de ses commits, y compris ceux qui touchent .github/workflows : le
      # GITHUB_TOKEN n'a pas le droit de pousser ce genre de commit, et un seul
      # suffisait a bloquer toute la synchro (2026-09-28, nightly-release.yml,
      # un workflow que ce fork n'utilise meme pas). On applique donc la
      # difference de code entre la derniere version reprise et la leur, sans
      # leur dossier .github, en un commit de ce robot. La version reprise est
      # notee dans .github/upstream-synced, que lit aussi watch-upstream.yml.
      # Un conflit avec nos propres changements fait echouer l'etape : en
      # rouge dans l'historique, comme une fusion qui echouait.
      - name: Take upstream finalburnneo/FBNeo's code, without its .github
        id: merge
        run: |
          git remote add upstream https://github.com/finalburnneo/FBNeo.git
          git fetch upstream master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          UP="$(git rev-parse upstream/master)"
          BASE="$(tr -d '[:space:]' < .github/upstream-synced)"
          if [ "$BASE" = "$UP" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --binary "$BASE" "$UP" -- . ':(exclude).github' > "$RUNNER_TEMP/upstream.patch"
          if [ -s "$RUNNER_TEMP/upstream.patch" ]; then
            git apply --3way "$RUNNER_TEMP/upstream.patch"
          fi
          echo "$UP" > .github/upstream-synced
          git add .github/upstream-synced
          {
            echo "Sync upstream finalburnneo/FBNeo to ${UP:0:9}"
            echo
            echo "Upstream commits taken, without their .github changes:"
            git log --reverse --format='- %h %s' "$BASE..$UP"
          } > "$RUNNER_TEMP/msg.txt"
          git commit -q -F "$RUNNER_TEMP/msg.txt"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check SDL/Windows DAT parity
        id: parity
        run: |
          comm -23 \
            <(grep -oE "DAT_[A-Z0-9_]+_ONLY" src/burner/win32/scrn.cpp | sort -u) \
            <(grep -oE "DAT_[A-Z0-9_]+_ONLY" src/burner/sdl/main.cpp | sort -u) \
            > missing_types.txt || true
          if [ -s missing_types.txt ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: File an issue if SDL fell behind Windows again
        if: steps.parity.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="Upstream's Windows generator (scrn.cpp) now calls DAT_*_ONLY types that src/burner/sdl/main.cpp's generateDats() does not:"
          BODY="$BODY

          $(cat missing_types.txt)

          Same class of bug as GBA/Astrocade: add the missing create_datfile() calls in both branches (the _stprintf and the plain sprintf one) of generateDats()."
          if ! gh issue list -R "${{ github.repository }}" --search "\"SDL DAT generation fell behind Windows again\" in:title" --state open --json number --jq '.[0].number' | grep -q .; then
            gh issue create -R "${{ github.repository }}" --title "SDL DAT generation fell behind Windows again" --body "$BODY"
          fi

      - name: Push the sync
        if: steps.merge.outputs.changed == 'true'
        run: git push origin master

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libsdl2-dev libsdl2-image-dev

      - name: Build Linux SDL2
        run: |
          make -j$(nproc) sdl2 SKIPDEPEND=1 RELEASEBUILD=1
          zip --junk-paths linux-sdl2-x86_64.zip fbneo src/license.txt

      # La release "latest" n'est plus jamais supprimee. L'ancienne etape la
      # supprimait avec son tag, puis la recreait : le 2026-09-28 la creation
      # a ete refusee (HTTP 403, "Resource not accessible by integration") et
      # le fork est reste SANS release, c'est-a-dire sans le FBNeo que
      # Bootcade telecharge ni les DAT du homelab. Maintenant : le tag est
      # deplace par un simple push (le commit vise est deja sur master), la
      # release existante recoit le nouveau zip, et elle n'est creee que si
      # elle manque. Un echec laisse l'ancienne release intacte.
      # --target : Bootcade lit target_commitish comme identite du binaire.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD)"
          TITLE="FBNeo-sdl (synced $(date -u +%Y-%m-%d))"
          NOTES="Rebuild of finalburnneo/FBNeo master with the SDL/Linux DAT-generation gaps restored (GBA, Bally Astrocade). Upstream no longer maintains SDL/Linux, see https://raw.githubusercontent.com/finalburnneo/FBNeo/master/.github/workflows/nightly-release.yml notes.

          fbneo-dats.zip: DAT files generated from this build by generate-dats.yml, pulled daily by the bootcade.duckdns.org homelab (scripts/fetch-fbneo-dats.sh in the homelab repo)."
          git tag -f latest "$SHA"
          git push -f origin refs/tags/latest
          if gh release view "latest" -R "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "latest" linux-sdl2-x86_64.zip -R "${{ github.repository }}" --clobber
            gh release edit "latest" -R "${{ github.repository }}" --title "$TITLE" --target "$SHA" --latest
          else
            gh release create "latest" -R "${{ github.repository }}" --verify-tag --title "$TITLE" \
              --latest --target "$SHA" --notes "$NOTES" linux-sdl2-x86_64.zip
          fi

      # Declenchement explicite plutot que `workflow_run` cote generate-dats :
      # GitHub ne cree pas de run pour un evenement provoque par le
      # GITHUB_TOKEN, sauf workflow_dispatch. Ce run ayant lui-meme ete lance
      # par le token du watcher, la fin de ce workflow pourrait ne pas
      # compter comme evenement ; un dispatch, si.
      - name: Generate the DAT files from the published build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run generate-dats.yml -R "${{ github.repository }}" --ref master
