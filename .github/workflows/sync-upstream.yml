name: Sync upstream and release

# Remet ce fork a jour sur finalburnneo/FBNeo, construit le binaire SDL2 et
# publie la release. Ces trois choses vont ensemble : sans fusion il n'y a
# rien de neuf a construire, et sans construction il n'y a rien a publier.
#
# La generation des DAT, elle, est a part (generate-dats.yml). Elle depend du
# binaire publie ici mais rien ne depend d'elle : un probleme de DAT ne doit
# pas empecher la release, et un echec de fusion ne doit pas empecher de
# regenerer des DAT depuis le binaire deja publie.
#
# Verifie aussi que le generateur SDL n'a pas pris de retard sur celui de
# Windows, et ouvre une issue le cas echeant : upstream ajoute des consoles
# cote Windows sans toucher a SDL, et nous livrions alors des DAT incomplets
# sans le savoir.

# Plus aucun cron ici (retire le 2026-10-11 : trop de passages a vide dans la
# liste des executions). GitHub ne notifie pas un fork des commits de son
# amont ; la synchro ne part donc que sur un workflow_dispatch, lance a la main
# ou par un appelant externe qui detecte les commits amont.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      behind: ${{ steps.compare.outputs.behind }}
    steps:
      # Comparaison de SHA, pas de compte de commits : depuis que la synchro
      # reprend le code amont sans son historique (2026-09-28), finalburnneo
      # et ce fork n'ont plus d'ancetre commun, un compte d'historique ne
      # dirait donc jamais zero. La reference est .github/upstream-synced.
      - name: Compare the upstream HEAD to the last commit taken
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head="$(gh api repos/finalburnneo/FBNeo/commits/master --jq .sha)"
          synced="$(gh api "repos/${{ github.repository }}/contents/.github/upstream-synced?ref=master" --jq .content | base64 -d | tr -d '[:space:]')"
          if [ "$head" != "$synced" ]; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
            echo "amont $head, repris $synced"
          else
            echo "behind=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: probe
    if: needs.probe.outputs.behind == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master

      # Un vrai `git merge upstream/master` : l'historique de l'amont entre dans
      # le fork, donc « N commits behind » de la page GitHub suit la realite.
      # Seule exception : nos workflows. Le GITHUB_TOKEN ne peut pas pousser un
      # changement de .github/workflows ; on garde donc notre .github tel quel
      # (ils ne remplacent jamais nos workflows) et seul .github/upstream-synced
      # est mis a jour. Un conflit de code fait echouer l'etape, en rouge.
      - name: Merge upstream finalburnneo/FBNeo
        id: merge
        run: |
          git remote add upstream https://github.com/finalburnneo/FBNeo.git
          git fetch upstream master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          UP="$(git rev-parse upstream/master)"
          if git merge-base --is-ancestor "$UP" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge upstream/master --no-commit --no-ff || true
          git rm -rq --cached .github
          git checkout HEAD -- .github
          git clean -fdq .github
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Conflits avec nos changements :"; git diff --name-only --diff-filter=U
            exit 1
          fi
          echo "$UP" > .github/upstream-synced
          git add .github/upstream-synced
          git commit -q -m "Merge upstream finalburnneo/FBNeo (${UP:0:9})"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check SDL/Windows DAT parity
        id: parity
        run: |
          comm -23 \
            <(grep -oE "DAT_[A-Z0-9_]+_ONLY" src/burner/win32/scrn.cpp | sort -u) \
            <(grep -oE "DAT_[A-Z0-9_]+_ONLY" src/burner/sdl/main.cpp | sort -u) \
            > missing_types.txt || true
          if [ -s missing_types.txt ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: File an issue if SDL fell behind Windows again
        if: steps.parity.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="Upstream's Windows generator (scrn.cpp) now calls DAT_*_ONLY types that src/burner/sdl/main.cpp's generateDats() does not:"
          BODY="$BODY

          $(cat missing_types.txt)

          Same class of bug as GBA/Astrocade: add the missing create_datfile() calls in both branches (the _stprintf and the plain sprintf one) of generateDats()."
          if ! gh issue list -R "${{ github.repository }}" --search "\"SDL DAT generation fell behind Windows again\" in:title" --state open --json number --jq '.[0].number' | grep -q .; then
            gh issue create -R "${{ github.repository }}" --title "SDL DAT generation fell behind Windows again" --body "$BODY"
          fi

      - name: Push the sync
        if: steps.merge.outputs.changed == 'true'
        run: |
          # Si GitHub refuse (un commit amont touche .github/workflows), meme
          # arbre en un commit a un seul parent : le code est repris, l'historique
          # non. Le build deja fait reste valable, l'arbre est identique.
          if ! git push origin master; then
            echo "Push du merge refuse : repli sur un commit sans historique amont."
            C="$(git commit-tree "$(git rev-parse HEAD^{tree})" -p HEAD^1 -m "Sync upstream finalburnneo/FBNeo to $(cat .github/upstream-synced | cut -c1-9)")"
            git reset -q --soft "$C"
            git push origin master
          fi

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libsdl2-dev libsdl2-image-dev libcurl4-openssl-dev

      - name: Build Linux SDL2
        run: |
          make -j$(nproc) sdl2 SKIPDEPEND=1 RELEASEBUILD=1
          zip --junk-paths linux-sdl2-x86_64.zip fbneo src/license.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "latest" -R "${{ github.repository }}" > /dev/null 2>&1; then
            gh release delete "latest" -R "${{ github.repository }}" --cleanup-tag --yes
          fi
          # Le titre et les notes portent le commit amont repris : la page
          # "compare" de GitHub affiche desormais le fork comme eternellement
          # "N commits behind" (nous prenons le code de l'amont, pas son
          # historique), elle ne dit donc plus rien de l'etat de la synchro.
          # La release, elle, le dit.
          UP="$(tr -d '[:space:]' < .github/upstream-synced)"
          gh release create "latest" -R "${{ github.repository }}" --title "FBNeo-sdl (upstream ${UP:0:9}, $(date -u +%Y-%m-%d))" \
            --latest --target "$(git rev-parse HEAD)" \
            --notes "Contient tout le code de finalburnneo/FBNeo jusqu'au commit [\`${UP:0:9}\`](https://github.com/finalburnneo/FBNeo/commit/$UP) inclus. Le bandeau \"N commits behind\" de la page du fork suit l'historique de l'amont (merge), la reference du code repris reste .github/upstream-synced.

          Rebuild of finalburnneo/FBNeo master with the SDL/Linux DAT-generation gaps restored (GBA, Bally Astrocade). Upstream no longer maintains SDL/Linux, see https://raw.githubusercontent.com/finalburnneo/FBNeo/master/.github/workflows/nightly-release.yml notes.

          fbneo-dats.zip: DAT files generated from this build by generate-dats.yml, pulled daily by the bootcade.duckdns.org homelab (scripts/fetch-fbneo-dats.sh in the homelab repo)." \
            linux-sdl2-x86_64.zip

      # Declenchement explicite plutot que `workflow_run` cote generate-dats :
      # GitHub ne cree pas de run pour un evenement provoque par le
      # GITHUB_TOKEN, sauf workflow_dispatch. Ce run ayant lui-meme ete lance
      # par le token du watcher, la fin de ce workflow pourrait ne pas
      # compter comme evenement ; un dispatch, si.
      - name: Generate the DAT files from the published build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run generate-dats.yml -R "${{ github.repository }}" --ref master
